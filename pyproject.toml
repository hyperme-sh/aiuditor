[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiuditor-service"
version = "0.1.0"
requires-python = ">=3.13"
description = "AIuditor policy, approval and model admission service"
dependencies = [
    "controlplane-legacy-auth-bridge @ git+https://github.com/hyperme-sh/controlplane-identity.git@8a04f6ff7accfd153b7094a9d010ac2254679577#subdirectory=compatibility",
    "httpx>=0.28.0",
    "cryptography>=46.0.0",
    "controlplane-api @ git+https://github.com/hyperme-sh/controlplane-api.git@82fc8c2ca21531f1a3f7a695257b3465c4a347da",
    "controlplane-tenancy @ git+https://github.com/hyperme-sh/controlplane-tenancy.git@f252909af772b2c820555af36de456d46f17cfcb",
    "controlplane-identity @ git+https://github.com/hyperme-sh/controlplane-identity.git@127d15fce7c3af8d8f8e239fb306ce88de76f02a",
    "controlplane-core @ git+https://github.com/hyperme-sh/controlplane-core.git@c46bf282a8f1a605cfb8acb9beafb474c0b1b0c8",
    "controlplane-db @ git+https://github.com/hyperme-sh/controlplane-db.git@95ef61433374274f4a4fc287e15982be6357e1cc",
    "controlplane-events @ git+https://github.com/hyperme-sh/controlplane-events.git@2a49f9af5f6c4dc9d6c4ddebc83c41d6331e2c87",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiuditor_service"]

[tool.hatch.build.targets.sdist]
include = ["/tests_artifacts", "/tests_tools", "/src", "/tests", "/scripts", "/docs", "/integration", "/migrations", "/edge-routes.json", "/pyproject.toml", "/uv.lock", "/README.md"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

markers = ["integration: requires owner migrations and PostgreSQL"]

[tool.uv]
override-dependencies = [
    "controlplane-db @ git+https://github.com/hyperme-sh/controlplane-db.git@95ef61433374274f4a4fc287e15982be6357e1cc",
]
