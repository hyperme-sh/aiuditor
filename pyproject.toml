[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiuditor-service"
version = "0.1.0"
requires-python = ">=3.13"
description = "AIuditor policy, approval and model admission service"
dependencies = [
    "controlplane-legacy-auth-bridge @ git+https://github.com/hyperme-sh/controlplane-identity.git@8b137e958c0084abe56c1c71c145b6e6bc22783c#subdirectory=compatibility",
    "httpx>=0.28.0",
    "cryptography>=46.0.0",
    "controlplane-api @ git+https://github.com/hyperme-sh/controlplane-api.git@0813448d067d59a0cc8fa2d144d85ddfde465af4",
    "controlplane-tenancy @ git+https://github.com/hyperme-sh/controlplane-tenancy.git@c1f37025a93c8b4e38699a42665ce380a66a54fd",
    "controlplane-identity @ git+https://github.com/hyperme-sh/controlplane-identity.git@5aeff3d2c00568f39ca6e8b75c7e63883d3a510b",
    "controlplane-core @ git+https://github.com/hyperme-sh/controlplane-core.git@d5e658e1a139b58718a1dc1a5a532efd63d4f01c",
    "controlplane-db @ git+https://github.com/hyperme-sh/controlplane-db.git@907b9390b3d68aa67903ffec849e9f1d64c17f1f",
    "controlplane-events @ git+https://github.com/hyperme-sh/controlplane-events.git@46a003cd2cc60528845b19d68f8d04ba7e4d7c46",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiuditor_service"]

[tool.hatch.build.targets.sdist]
include = ["/tests_artifacts", "/tests_tools", "/src", "/tests", "/scripts", "/docs", "/integration", "/migrations", "/edge-routes.json", "/pyproject.toml", "/uv.lock", "/README.md"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

markers = ["integration: requires owner migrations and PostgreSQL"]

[tool.uv]
override-dependencies = [
    "controlplane-db @ git+https://github.com/hyperme-sh/controlplane-db.git@907b9390b3d68aa67903ffec849e9f1d64c17f1f",
    "controlplane-events @ git+https://github.com/hyperme-sh/controlplane-events.git@46a003cd2cc60528845b19d68f8d04ba7e4d7c46",
]
