[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiuditor-service"
version = "0.1.0"
requires-python = ">=3.13"
description = "AIuditor policy, approval and model admission service"
dependencies = [
    "controlplane-legacy-auth-bridge @ git+https://github.com/hyperme-sh/controlplane-identity.git@f9d2e127efa0793342fff0a07efa71934aa9b5fe#subdirectory=compatibility",
    "httpx>=0.28.0",
    "cryptography>=46.0.0",
    "controlplane-api @ git+https://github.com/hyperme-sh/controlplane-api.git@0f9dbf4e63b86b692936e6f91d4eda832cbf19ad",
    "controlplane-tenancy @ git+https://github.com/hyperme-sh/controlplane-tenancy.git@0ed0ab50548f65fdd63ffb7ef614527a7a5158a6",
    "controlplane-identity @ git+https://github.com/hyperme-sh/controlplane-identity.git@e7c8f42080f41a85a43f5dbbad2cb05ac958c823",
    "controlplane-core @ git+https://github.com/hyperme-sh/controlplane-core.git@6095a5d0798fbe4767362a4d4389f112ab050e8e",
    "controlplane-db @ git+https://github.com/hyperme-sh/controlplane-db.git@abdcad2f82b827c4898963dc6b3f0025ed68b9d3",
    "controlplane-events @ git+https://github.com/hyperme-sh/controlplane-events.git@a04d980e25f71cb1d52fec7f8525633d5eb09e8f",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aiuditor_service"]

[tool.hatch.build.targets.sdist]
include = ["/tests_artifacts", "/tests_tools", "/src", "/tests", "/scripts", "/docs", "/integration", "/migrations", "/edge-routes.json", "/pyproject.toml", "/uv.lock", "/README.md"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

markers = ["integration: requires owner migrations and PostgreSQL"]

[tool.uv]
override-dependencies = [
    "controlplane-db @ git+https://github.com/hyperme-sh/controlplane-db.git@abdcad2f82b827c4898963dc6b3f0025ed68b9d3",
]
