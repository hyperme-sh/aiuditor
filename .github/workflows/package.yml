name: Standalone package
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    permissions:
      contents: read
      packages: write
    if: github.ref == 'refs/heads/main'
    runs-on:
      group: shared-local
      labels: [self-hosted, linux, x64, debrunner]
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          POSTGRES_PASSWORD: package-test-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    environment: controlplane-libs-read
    steps:
      - name: Mint repository-scoped dependency token
        id: dependency-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ vars.CONTROLPLANE_LIBS_APP_ID }}
          private-key: ${{ secrets.CONTROLPLANE_LIBS_APP_PRIVATE_KEY }}
          owner: hyperme-sh
          permission-contents: read
          repositories: |
            controlplane-api
            controlplane-core
            controlplane-db
            controlplane-events
            controlplane-identity
            controlplane-tenancy
            user-service
      - name: Prepare release output
        run: echo "RELEASE_ARTIFACT_DIR=$(mktemp -d "$RUNNER_TEMP/release-dist.XXXXXX")" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.26'
          python-version: '3.13'
      - name: Validate AIuditor package
        env:
          DEPENDENCY_READ_TOKEN: ${{ steps.dependency-token.outputs.token }}
          TEST_DATABASE_URL: postgresql+psycopg://postgres:package-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPENDENCY_READ_TOKEN" || { echo 'Private dependency read access is required'; exit 1; }
          header=$(printf 'x-access-token:%s' "$DEPENDENCY_READ_TOKEN" | base64 -w0)
          echo "::add-mask::$header"
          export GIT_CONFIG_COUNT=7
          export GIT_CONFIG_KEY_0=http.https://github.com/hyperme-sh/controlplane-api.git.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $header"
          export GIT_CONFIG_KEY_1=http.https://github.com/hyperme-sh/controlplane-tenancy.git.extraheader
          export GIT_CONFIG_VALUE_1="AUTHORIZATION: basic $header"
          export GIT_CONFIG_KEY_2=http.https://github.com/hyperme-sh/controlplane-identity.git.extraheader
          export GIT_CONFIG_VALUE_2="AUTHORIZATION: basic $header"
          export GIT_CONFIG_KEY_3=http.https://github.com/hyperme-sh/controlplane-db.git.extraheader
          export GIT_CONFIG_VALUE_3="AUTHORIZATION: basic $header"
          export GIT_CONFIG_KEY_4=http.https://github.com/hyperme-sh/controlplane-events.git.extraheader
          export GIT_CONFIG_VALUE_4="AUTHORIZATION: basic $header"
          export GIT_CONFIG_KEY_5=http.https://github.com/hyperme-sh/user-service.git.extraheader
          export GIT_CONFIG_VALUE_5="AUTHORIZATION: basic $header"
          export GIT_CONFIG_KEY_6=http.https://github.com/hyperme-sh/controlplane-core.git.extraheader
          export GIT_CONFIG_VALUE_6="AUTHORIZATION: basic $header"
          unset DEPENDENCY_READ_TOKEN
          bash scripts/check-package.sh
          bash scripts/check-postgres.sh
      - name: Check registry publication failure handling
        run: python3 scripts/test-image-publication.py
      - name: Build standalone runtime image
        env:
          DEPENDENCY_READ_TOKEN: ${{ steps.dependency-token.outputs.token }}
        run: |
          docker build --secret id=dependency_read_token,env=DEPENDENCY_READ_TOKEN \
            --build-arg SOURCE_SHA="$GITHUB_SHA" \
            --build-arg BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t aiuditor:ci-${{ github.run_id }}-${{ github.run_attempt }} .
          docker run --rm --network none --entrypoint /app/.venv/bin/python aiuditor:ci-${{ github.run_id }}-${{ github.run_attempt }} \
            -c 'from aiuditor_service.app import app; import controlplane_db; assert app.openapi()["paths"]'
      - name: Publish the qualified main runtime and record its digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/runtime-login.XXXXXX")
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          local_image="aiuditor:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          config=$(docker image inspect "$local_image" --format '{{.Id}}')
          revision=$(docker image inspect "$local_image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          test "$revision" = "$GITHUB_SHA"
          image="ghcr.io/${GITHUB_REPOSITORY,,}/runtime:test-${GITHUB_SHA}"
          if [[ "$GITHUB_RUN_ATTEMPT" != 1 ]]; then image="$image-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"; fi
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # Existing candidates cannot silently change on a rerun.
          if docker manifest inspect "$image" > /dev/null 2>manifest.err; then
            echo 'Test image already exists; refusing to replace its content' >&2
            exit 1
          elif [[ "$(cat manifest.err)" != "no such manifest: $image" && "$(cat manifest.err)" != "manifest unknown" ]]; then
            cat manifest.err >&2
            echo 'Registry lookup did not establish an absent manifest; refusing publication' >&2
            exit 1
          fi
          docker tag "$local_image" "$image"
          trap 'docker image rm "$image" >/dev/null 2>&1 || true; rm -rf -- "$DOCKER_CONFIG"' EXIT
          docker push "$image"
          repo="ghcr.io/${GITHUB_REPOSITORY,,}/runtime"
          ref=$(docker image inspect "$image" --format '{{range .RepoDigests}}{{println .}}{{end}}' | awk -v repo="$repo@" 'index($0,repo)==1')
          [[ "$ref" =~ @sha256:[a-f0-9]{64}$ ]]
          directory="$RELEASE_ARTIFACT_DIR"
          mkdir -p "$directory"
          python3 - "$ref" "$config" "$directory/runtime-image.json" <<'PYTHON'
          import json, os, sys
          from pathlib import Path
          Path(sys.argv[3]).write_text(json.dumps(dict(image=sys.argv[1], image_id=sys.argv[2],
              repository=os.environ['GITHUB_REPOSITORY'], revision=os.environ['GITHUB_SHA'],
              run_id=int(os.environ['GITHUB_RUN_ID'])), sort_keys=True)+'\n')
          PYTHON
      - name: Retain validated package bytes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tested-dist
          path: ${{ env.RELEASE_ARTIFACT_DIR }}/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Remove job-owned runtime aliases
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker image rm "aiuditor:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >/dev/null 2>&1 || true
