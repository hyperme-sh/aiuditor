name: Package preparation
on:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
        env:
          POSTGRES_PASSWORD: package-test-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.26'
          python-version: '3.13'
      - name: Qualify source, wheel and rebuilt source archive
        run: bash scripts/check-package.sh --fixtures
      - name: Qualify owner PostgreSQL and HTTP contracts
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:package-test-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        run: bash scripts/check-postgres.sh --fixtures
      - name: Check container publication conditions
        run: python3 scripts/test-image-publication.py
      - name: Build and check container without registry credentials
        run: |
          set -euo pipefail
          image="aiuditor:pr-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'docker image rm "$image" >/dev/null 2>&1 || true' EXIT
          docker build --build-arg SOURCE_SHA="$GITHUB_SHA" -t "$image" .
          docker run --rm --network none --entrypoint /app/.venv/bin/python "$image" \
            -c 'from aiuditor_service.app import app; assert app.openapi()["paths"]'
