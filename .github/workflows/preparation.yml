name: Package preparation
on:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.26'
          python-version: '3.13'
      - name: Qualify source, wheel and rebuilt source archive
        run: bash scripts/check-package.sh --fixtures
      - name: Check container publication conditions
        run: python3 scripts/test-image-publication.py
      - name: Build and check container without registry credentials
        run: |
          set -euo pipefail
          image="aiuditor:pr-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'docker image rm "$image" >/dev/null 2>&1 || true' EXIT
          docker build --build-arg SOURCE_SHA="$GITHUB_SHA" -t "$image" .
          docker run --rm --network none --entrypoint /app/.venv/bin/python "$image" \
            -c 'from aiuditor_service.app import app; assert app.openapi()["paths"]'
