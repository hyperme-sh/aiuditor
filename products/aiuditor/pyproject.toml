[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiuditor-service"
version = "0.1.0"
requires-python = ">=3.13"
description = "AIuditor grant plane: connections, later contracts and approvals"
dependencies = [
    "controlplane-core",
    "controlplane-db",
    "controlplane-events",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=6.0.0",
]

[tool.uv.sources]
controlplane-core = { workspace = true }
controlplane-db = { workspace = true }
controlplane-events = { workspace = true }

[tool.hatch.build.targets.wheel]
only-include = ["src/aiuditor_service"]

[tool.hatch.build.targets.sdist]
include = ["src/aiuditor_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [
    "src",
    "../../core/lib/controlplane-core/src",
    "../../core/lib/controlplane-db/src",
    "../../core/events/src",
]
testpaths = ["tests"]
